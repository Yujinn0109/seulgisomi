<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/fonts/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:var(--color-background-tertiary);color:var(--color-text-primary);font-size:14px;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);padding:20px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:0 20px 20px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:12px}
.sidebar-logo h1{font-size:15px;font-weight:500}
.sidebar-logo p{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--color-text-secondary);font-size:13px;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.nav-item.active{color:#7F77DD;border-left:2px solid #7F77DD;background:var(--color-background-secondary);font-weight:500}
.nav-item i{font-size:17px}
.main{flex:1;padding:24px;overflow-x:hidden}
.page{display:none}.page.active{display:block}
.page-title{font-size:18px;font-weight:500;margin-bottom:20px}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:200;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--color-text-secondary)}
.loading-overlay.hidden{display:none}
.spinner{width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#7F77DD;border-radius:50%;animation:spin .6s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;font-size:12px;padding:10px 16px;border-radius:8px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.btn{padding:7px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);cursor:pointer;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);transition:background .1s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:#7F77DD;color:#fff;border-color:#7F77DD}.btn-primary:hover{background:#534AB7}
.btn-danger{color:#A32D2D;border-color:#F09595}.btn-danger:hover{background:#FCEBEB}
.btn-sm{padding:3px 9px;font-size:11px}
.badge{font-size:10px;padding:2px 7px;border-radius:var(--border-radius-md);font-weight:500}
.badge-seulgi{background:#E6F1FB;color:#185FA5}
.badge-somi{background:#FBEAF0;color:#993556}
.badge-both{background:#EEEDFE;color:#534AB7}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:12px;padding:24px;width:390px;border:1px solid #e0e0e0;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#111}
.modal label{font-size:12px;color:#555;display:block;margin-bottom:4px;font-weight:500}
.modal input,.modal select,.modal textarea{width:100%;margin-bottom:12px;font-size:13px;padding:8px 11px;border:1px solid #d0d0d0;border-radius:7px;background:#fff;color:#111;outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#7F77DD;box-shadow:0 0 0 2px rgba(127,119,221,.15)}
.modal textarea{resize:none}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px}
/* Calendar */
.cal-grid{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:var(--color-background-secondary)}
.cal-weekday{text-align:center;padding:8px 0;font-size:12px;font-weight:500;color:var(--color-text-secondary)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{min-height:90px;padding:6px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;transition:background .1s}
.cal-day:hover{background:var(--color-background-secondary)}
.cal-day.other-month .day-num{color:var(--color-text-tertiary)}
.cal-day.today .day-num{background:#7F77DD;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:500}
.day-num{font-size:12px;font-weight:500;margin-bottom:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t-shoot{background:#FAEEDA;color:#633806}.t-meeting{background:#EAF3DE;color:#27500A}.t-holiday{background:#FCEBEB;color:#791F1F}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.legend-dot{width:10px;height:10px;border-radius:50%}
.gcal-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.gcal-badge.synced{background:#EAF3DE;color:#27500A}.gcal-badge.error{background:#FCEBEB;color:#791F1F}.gcal-badge.loading{background:#EEEDFE;color:#534AB7}
/* Upload table */
.upload-table{width:100%;border-collapse:collapse;background:var(--color-background-primary);border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary)}
.upload-table th{padding:10px 14px;text-align:left;font-size:12px;font-weight:500;color:var(--color-text-secondary);background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.upload-table td{padding:10px 14px;font-size:13px;border-bottom:0.5px solid var(--color-border-tertiary)}
.upload-table tr:last-child td{border-bottom:none}
.upload-table tr:hover td{background:var(--color-background-secondary);cursor:pointer}
.status-badge{font-size:11px;padding:3px 8px;border-radius:var(--border-radius-md);font-weight:500}
.status-done{background:#EAF3DE;color:#27500A}.status-edit{background:#E6F1FB;color:#0C447C}.status-plan{background:#EEEDFE;color:#3C3489}.status-review{background:#FAEEDA;color:#633806}.status-shoot{background:#FEF0E6;color:#7A3800}
/* Resource */
.resource-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.resource-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px}
.resource-card h3{font-size:13px;font-weight:500;margin-bottom:12px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px}
.resource-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.resource-item:last-child{border-bottom:none}
.resource-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.resource-item:hover .resource-actions{opacity:1}
.icon-btn{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;font-size:12px;color:var(--color-text-secondary)}
.icon-btn:hover{background:var(--color-background-secondary)}
/* Member card */
.member-card{border-radius:var(--border-radius-lg);padding:14px}
.add-task-btn{width:100%;margin-top:7px;padding:4px;border:0.5px dashed var(--color-border-secondary);border-radius:5px;background:rgba(255,255,255,.5);cursor:pointer;font-size:10px;transition:all .15s}
.add-task-btn:hover{background:rgba(255,255,255,.85)}
/* Notice */
.notice-row{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:0.5px solid var(--color-border-tertiary);transition:background .1s}
.notice-row:hover{background:var(--color-background-secondary)}
.notice-row:last-child{border-bottom:none}
/* Memo accordion */
.memo-row{border-bottom:0.5px solid var(--color-border-tertiary)}
.memo-row:last-child{border-bottom:none}
.memo-title-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;transition:background .1s}
.memo-title-row:hover{background:var(--color-background-secondary)}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay"><div class="spinner"></div> 데이터 불러오는 중...</div>
<div class="toast" id="toast"></div>
<h2 class="sr-only">유튜브 팀 대시보드</h2>

<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo"><h1>팀 대시보드</h1><p>슬기 &amp; 소미</p></div>
  <div class="nav-item active" onclick="showPage('home',this)"><i class="ti ti-home"></i> 홈</div>
  <div class="nav-item" onclick="showPage('calendar',this)"><i class="ti ti-calendar"></i> 캘린더</div>
  <div class="nav-item" onclick="showPage('upload',this)"><i class="ti ti-upload"></i> 업로드 스케줄</div>
  <div class="nav-item" onclick="showPage('resource',this)"><i class="ti ti-folder"></i> 리소스 허브</div>
  <div class="nav-item" onclick="showPage('notice',this)"><i class="ti ti-bell"></i> 공지 게시판</div>
</aside>

<main class="main">

<!-- HOME -->
<div id="page-home" class="page active">
  <h2 class="page-title">오늘의 현황</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <i class="ti ti-calendar-event" style="font-size:17px;color:#7F77DD"></i>
        <span style="font-size:13px;font-weight:500">내일 예정된 일정</span>
        <span id="tomorrow-date" style="font-size:11px;color:var(--color-text-secondary);margin-left:auto"></span>
      </div>
      <div id="tomorrow-list" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <i class="ti ti-upload" style="font-size:17px;color:#1D9E75"></i>
        <span style="font-size:13px;font-weight:500">이번 주 업로드</span>
      </div>
      <div id="thisweek-upload" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <i class="ti ti-users" style="font-size:17px;color:#378ADD"></i>
      <span style="font-size:13px;font-weight:500">팀원 현황</span>
    </div>
    <div id="member-tasks" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"></div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="ti ti-arrow-right-circle" style="font-size:17px;color:#F76754"></i>
        <span style="font-size:13px;font-weight:500">인수인계</span>
      </div>
      <button class="btn btn-primary" style="padding:4px 12px;font-size:12px" onclick="openAddHandover()"><i class="ti ti-plus"></i> 추가</button>
    </div>
    <div id="handover-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

<!-- CALENDAR -->
<div id="page-calendar" class="page">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <h2 class="page-title" style="margin:0">캘린더</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="switchCalView('month')" id="cal-btn-month" style="background:#7F77DD;color:#fff;border-color:#7F77DD">월간</button>
      <button class="btn btn-sm" onclick="switchCalView('week')" id="cal-btn-week">주간</button>
      <a href="https://calendar.google.com" target="_blank" class="btn btn-sm" style="text-decoration:none"><i class="ti ti-external-link"></i> 구글 캘린더 열기</a>
      <button class="btn btn-primary" onclick="openAddEvent()"><i class="ti ti-plus"></i> 일정 추가</button>
    </div>
  </div>
  <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
    <iframe id="gcal-iframe"
      src="https://calendar.google.com/calendar/embed?src=ep.zinny%40gmail.com&src=5b4e1758e3f442eb16aa8a8c4cceb0c70622185b1421e7eb138fcc121bd307da%40group.calendar.google.com&src=dce5a03ba7bf72f94b36d42862b5bfbae156cb000322e1e02fa4846f76ada0cd%40group.calendar.google.com&src=38140e2be6d125a8518d2c88c8dd825ad06d98b583d94a2d443904f5578a5467%40group.calendar.google.com&src=f40fcd9811932b103020d0ed567189ace37c4cf4960c87ad4131df6d73572e41%40group.calendar.google.com&src=d6f45f65bdf009093bcfb7e1f6a6c37b9168c497c094ed7d12308ae141148854%40group.calendar.google.com&src=52e4367e3eba394da2fd7b0e06dd29ebe8bc5ce06d711e61cef2876cf852c7d3%40group.calendar.google.com&ctz=Asia%2FSeoul&hl=ko&mode=MONTH&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=1&showTz=0"
      style="width:100%;height:700px;border:none"
      frameborder="0"
      scrolling="no">
    </iframe>
  </div>
  <p style="font-size:11px;color:var(--color-text-secondary);margin-top:8px;text-align:center">구글 계정에 로그인된 상태에서 정상적으로 보여요</p>
</div>

<!-- UPLOAD -->
<div id="page-upload" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h2 class="page-title" style="margin:0">업로드 스케줄</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="display:flex;gap:6px">
        <button id="up-tab-all" class="btn btn-primary btn-sm" onclick="filterUpload('all',this)">전체</button>
        <button id="up-tab-seulgi" class="btn btn-sm" onclick="filterUpload('seulgi',this)">슬기</button>
        <button id="up-tab-somi" class="btn btn-sm" onclick="filterUpload('somi',this)">소미</button>
      </div>
      <button class="btn btn-primary" onclick="openAddUpload()"><i class="ti ti-plus"></i> 일정 추가</button>
    </div>
  </div>
  <table class="upload-table">
    <thead><tr><th>채널</th><th>영상 제목</th><th>담당자</th><th>예정 업로드일</th><th>상태</th><th></th></tr></thead>
    <tbody id="upload-tbody"></tbody>
  </table>
</div>

<!-- RESOURCE -->
<div id="page-resource" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h2 class="page-title" style="margin:0">리소스 허브</h2>
    <button class="btn btn-primary" onclick="openAddResource()"><i class="ti ti-plus"></i> 링크 추가</button>
  </div>
  <div class="resource-grid" id="resource-grid"></div>
  <div style="margin-top:14px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="ti ti-notes" style="font-size:16px;color:#7F77DD"></i>
        <span style="font-size:13px;font-weight:500">메모 & 텍스트</span>
      </div>
      <button class="btn btn-primary" style="padding:4px 12px;font-size:12px" onclick="openAddMemo()"><i class="ti ti-plus"></i> 추가</button>
    </div>
    <div id="memo-list"></div>
    <div id="memo-empty" style="display:none;padding:20px;text-align:center;font-size:12px;color:var(--color-text-secondary)">아직 메모가 없어요</div>
  </div>
</div>

<!-- NOTICE -->
<div id="page-notice" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 class="page-title" style="margin:0">공지 게시판</h2>
    <button class="btn btn-primary" onclick="openAddNotice()"><i class="ti ti-plus"></i> 공지 작성</button>
  </div>
  <div style="display:flex;gap:0;margin-bottom:16px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:4px;width:fit-content">
    <button id="tab-episode" onclick="switchNoticeBoard('episode')" style="padding:7px 20px;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;background:#7F77DD;color:#fff;transition:all .15s">🎬 에피소드 공지</button>
    <button id="tab-internal" onclick="switchNoticeBoard('internal')" style="padding:7px 20px;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--color-text-secondary);transition:all .15s">🔒 내부 공지</button>
  </div>
  <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
    <div id="notice-list"></div>
    <div id="notice-empty" style="display:none;padding:24px;text-align:center;font-size:12px;color:var(--color-text-secondary)">아직 공지가 없어요</div>
  </div>
</div>

</main>
</div>

<!-- ── MODALS ── -->

<!-- 일정 추가 -->
<div id="modal-event" class="modal-overlay" style="display:none" onclick="closeModal('modal-event',event)">
  <div class="modal"><h3>일정 추가</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>시작일</label><input type="date" id="ev-date"></div>
      <div><label>종료일 <span style="font-weight:400;color:#999">(선택)</span></label><input type="date" id="ev-end-date"></div>
    </div>
    <label>반복</label>
    <select id="ev-repeat" onchange="toggleRepeatUntil()">
      <option value="none">반복 없음</option>
      <option value="weekly">매주 반복</option>
      <option value="biweekly">2주마다 반복</option>
      <option value="monthly">매월 반복</option>
    </select>
    <div id="ev-repeat-until-wrap" style="display:none">
      <label>반복 종료일</label><input type="date" id="ev-repeat-until">
    </div>
    <label>유형</label>
    <select id="ev-type">
      <option value="edit">편집</option><option value="shoot">촬영</option>
      <option value="meeting">회의</option><option value="holiday">휴무</option>
    </select>
    <label>멤버</label>
    <select id="ev-member">
      <option value="jini">지니</option><option value="eden">이든</option>
      <option value="jamie">제이미</option><option value="cherish">체리시</option>
      <option value="may">메이</option><option value="new">신규입사자A</option>
      <option value="maeve">메이브</option><option value="team">팀 전체</option>
    </select>
    <label>채널</label>
    <select id="ev-channel">
      <option value="seulgi">슬기</option><option value="somi">소미</option><option value="both">공통</option>
    </select>
    <label>메모</label><textarea id="ev-memo" placeholder="메모 (선택)" style="height:60px"></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-event')">취소</button>
      <button class="btn btn-primary" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- 업로드 추가/수정 -->
<div id="modal-upload" class="modal-overlay" style="display:none" onclick="closeModal('modal-upload',event)">
  <div class="modal"><h3 id="up-modal-title">업로드 일정 추가</h3>
    <input type="hidden" id="up-edit-id">
    <label>채널</label>
    <select id="up-channel"><option value="seulgi">슬기</option><option value="somi">소미</option></select>

// ── 구글 캘린더 (홈 내일 일정 백그라운드 동기화 전용) ──
async function syncGoogleCalendar(){
  if(!GCAL_API_KEY||GCAL_API_KEY==='YOUR_GOOGLE_API_KEY_HERE') return;
  try{
    const now=new Date();
    // 한국시간(UTC+9) 기준으로 이전달 1일 ~ 3달 후 말일
    const kstOffset = 9 * 60 * 60 * 1000;
    const tMin=new Date(new Date(now.getFullYear(),now.getMonth()-1,1).getTime() - kstOffset).toISOString();
    const tMax=new Date(new Date(now.getFullYear(),now.getMonth()+3,0,23,59,59).getTime() - kstOffset).toISOString();
    const results=await Promise.all(GCAL_IDS.map(async id=>{
      const [calInfo,evRes]=await Promise.all([
        fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}?key=${GCAL_API_KEY}`).then(r=>r.json()),
        fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}/events?key=${GCAL_API_KEY}&timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=200`).then(r=>r.json())
      ]);
      const color=calInfo.backgroundColor||'#7F77DD';
      const calName=calInfo.summary||'구글';
      return {color,calName,items:evRes.items||[]};
    }));
    gcalEvents=[];
    results.forEach(({color,calName,items})=>{
      items.forEach(ev=>{
        const date=(ev.start?.date||ev.start?.dateTime||'').slice(0,10);
        if(date) gcalEvents.push({title:ev.summary||'(제목 없음)',date,color,calName});
      });
    });
    renderHome(); // 홈 내일 일정만 조용히 업데이트
  }catch(e){
    console.warn('[GCal] 백그라운드 동기화 실패:', e.message);
  }
}

// ── 저장 ──
async function saveEvent(){
  const date=document.getElementById('ev-date').value;
  if(!date){showToast('시작일을 선택해주세요');return;}
  const endDate=document.getElementById('ev-end-date').value;
  const repeat=document.getElementById('ev-repeat').value;
  const repeatUntil=document.getElementById('ev-repeat-until').value;
  const type=document.getElementById('ev-type').value;
  const member=document.getElementById('ev-member').value;
  const channel=document.getElementById('ev-channel').value;
  const memo=document.getElementById('ev-memo').value;
  const rows=[];
  if(repeat!=='none'){
    if(!repeatUntil){showToast('반복 종료일을 선택해주세요');return;}
    let cur=new Date(date);const until=new Date(repeatUntil);
    const step=repeat==='weekly'?7:repeat==='biweekly'?14:null;
    while(cur<=until){rows.push({date:fmt(cur),type,member,channel,memo});if(step)cur.setDate(cur.getDate()+step);else cur.setMonth(cur.getMonth()+1);}
  }else if(endDate&&endDate>date){
    let cur=new Date(date);const end=new Date(endDate);
    while(cur<=end){rows.push({date:fmt(cur),type,member,channel,memo});cur.setDate(cur.getDate()+1);}
  }else{rows.push({date,type,member,channel,memo});}
  const{error}=await db.from('events').insert(rows);
  if(error){showToast('저장 실패: '+error.message);return;}
  closeModal('modal-event');showToast(rows.length>1?`${rows.length}개 일정 저장됐어요 ✓`:'일정 저장됐어요 ✓');
}

async function saveUpload(){
  const id=document.getElementById('up-edit-id').value;

  if(!title||!date){showToast('제목과 날짜를 입력해주세요');return;}
  const checked=[...document.querySelectorAll('.up-member-cb:checked')].map(cb=>cb.value);
  if(!checked.length){showToast('담당자를 1명 이상 선택해주세요');return;}
  const payload={channel:document.getElementById('up-channel').value,title,member:checked.join(', '),date,status:document.getElementById('up-status').value};
  let error;
  if(id){({error}=await db.from('uploads').update(payload).eq('id',id));}
  else{({error}=await db.from('uploads').insert(payload));}
  if(error){showToast('저장 실패: '+error.message);return;}
  closeModal('modal-upload');showToast(id?'수정됐어요 ✓':'추가됐어요 ✓');
}
